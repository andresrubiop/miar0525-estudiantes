[project]
name = "miar0525-aprendizaje-automatico"
version = "0.1.0"
description = "Notebooks y utilidades de la asignatura Aprendizaje Automático (MIAR0525) · Maestría en IA · UEES"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "scipy>=1.14",
    "scikit-learn>=1.8",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
# Semana 2 en adelante (seguimiento de experimentos) y semana 4 (equidad y explicabilidad)
mlflow = ["mlflow>=3.0"]
etica = ["fairlearn>=0.12", "shap>=0.46"]

[dependency-groups]
# Solo para quien produce el material: ejecutar y verificar los notebooks
dev = [
    "nbclient>=0.10",
    "nbformat>=5.10",
    "ipykernel>=6.29",
    "pytest>=8",
]
lab = ["jupyterlab>=4.3"]

[tool.uv]
default-groups = ["dev"]
package = false
